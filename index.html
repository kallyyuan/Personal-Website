<body data-screen="gate" data-time="day">
  <a class="skip-main" href="#main">Skip to main content</a>

  <!-- Drawing library: fine line icons and the rough stamp filter. Nothing to edit. -->
  <svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="rough-ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-arrow-long" viewBox="0 0 24 24"><path d="M3 12h18m-5-5l5 5-5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M4 12l8-8h8v8l-8 8z"/><path d="M15.5 8.5h.01"/></symbol>
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.2 8.2L20 19M8.2 15.8L20 5"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.8a7.6 7.6 0 010 10.4"/></symbol>
    <symbol id="i-speaker-off" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-light" viewBox="0 0 24 24"><path d="M9 17.5h6M10 20.5h4"/><path d="M12 3.5a6 6 0 00-3.4 10.9c.6.5.9 1.2.9 2v.6h5v-.6c0-.8.3-1.5.9-2A6 6 0 0012 3.5z"/></symbol>
    <symbol id="i-belt" viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="2.3"/><path d="M7.5 20v-6.5c0-2.2 1.9-3.8 4.5-3.8s4.5 1.6 4.5 3.8V20M7.5 12.6l9 5.2"/></symbol>
  </svg>

  <!-- The window: a painted sky that follows the time of day. Built by js/sky.js -->
  <div class="sky" id="sky" aria-hidden="true"></div>

  <header class="hud" id="hud">
    <a class="hud-brand" href="#/menu" id="hud-brand" aria-label="Kally Yuan, back to the menu">Kally Yuan</a>
    <a class="hud-link hud-skip" href="#/work" id="hud-skip">
      <span>Short on time? Skip to the work index</span>
      <svg class="ico" aria-hidden="true"><use href="#i-arrow-long"/></svg>
    </a>
    <div class="hud-right">
      <button class="hud-link hud-light" id="hud-light" type="button" aria-pressed="false" aria-label="Reading light">
        <svg class="ico" aria-hidden="true"><use href="#i-light"/></svg>
        <span>Light</span>
      </button>
      <button class="hud-link hud-sound" id="hud-sound" type="button" aria-pressed="false" aria-label="Sound">
        <svg class="ico" aria-hidden="true"><use href="#i-speaker-off"/></svg>
        <span>Sound</span>
      </button>
      <button class="hud-link hud-captain" id="hud-captain" type="button" aria-haspopup="dialog">
        <span>Your captain</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="screen" id="screen-gate" data-screen="gate" aria-labelledby="gate-title" hidden></section>
    <section class="screen" id="screen-seat" data-screen="seat" aria-labelledby="seat-title" hidden></section>
    <section class="screen" id="screen-piece" data-screen="piece" aria-labelledby="piece-title" hidden></section>
  </main>

  <dialog class="captain-dialog" id="captain-dialog" aria-labelledby="captain-title"></dialog>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">
      <h1>Kally Yuan</h1>
      <p>This portfolio is an interactive flight and needs JavaScript to take off. Please turn it on, or email Kally directly.</p>
    </div>
  </noscript>

</body>
